# Dependabot configuration for zakuro-ai/zakuro.
#
# Closes the dependency-update half of #119. Three ecosystems are covered:
# Python (via uv-style pyproject), GitHub Actions, and Docker base images.
# Security updates are surfaced immediately; non-security updates are
# batched weekly to avoid PR-storm fatigue.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ecosystem/python"
    groups:
      python-runtime:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ecosystem/actions"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ecosystem/docker"
    commit-message:
      prefix: "build(docker)"
