name: bench

# Continuous benchmarking (#130). Nightly schedule runs scripts/bench_all.py
# and compares the result to bench/baselines/<runner>.json. A regression
# over the threshold opens an issue with a markdown delta table. Manual
# `workflow_dispatch` with the `rebless` input re-anoints the baseline.
#
# CAVEAT: GitHub-hosted runner numbers are noisier than a dedicated bench
# box. We pick a 10% threshold to absorb the noise floor; once a self-hosted
# runner lands we can tighten to 5% on that lane.

on:
  schedule:
    - cron: "37 3 * * *"   # nightly, 03:37 UTC
  workflow_dispatch:
    inputs:
      rebless:
        description: "Set to true to overwrite the baseline with this run's numbers"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

concurrency:
  group: bench-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bench:
    name: bench (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4

      - name: Install zakuro + worker extras
        run: |
          uv sync --frozen --extra worker

      - name: Run bench_all.py
        # The bench harness spawns real subprocess workers. --log writes
        # the consolidated JSON we compare against the baseline.
        run: |
          mkdir -p bench/results
          uv run python scripts/bench_all.py --log bench/results/run.json

      - name: Compare to baseline (or rebless)
        id: compare
        run: |
          mkdir -p bench/baselines
          rebless_flag=""
          if [ "${{ github.event.inputs.rebless }}" = "true" ]; then
            rebless_flag="--rebless"
          fi
          uv run python scripts/bench_compare.py \
            --result bench/results/run.json \
            --baseline bench/baselines/ubuntu-latest.json \
            --threshold 0.10 \
            --report bench/results/report.md \
            $rebless_flag

      - name: Upload bench artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.run_id }}
          path: |
            bench/results/run.json
            bench/results/report.md
          retention-days: 30

      - name: Open regression issue
        # `compare.py` exits 1 on regression. Only fire on scheduled runs;
        # workflow_dispatch is typically a re-bless that should not file a
        # ticket against itself.
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('bench/results/report.md', 'utf8');
            const title = `bench: regression detected on ${new Date().toISOString().slice(0,10)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body + `\n\n— commit ${context.sha}\n— [run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['perf', 'regression', 'auto-filed'],
            });

      - name: Commit re-blessed baseline
        # Only on workflow_dispatch with rebless=true.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.rebless == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bench: rebless baseline (manual, run ${{ github.run_id }})"
          file_pattern: "bench/baselines/*.json"
