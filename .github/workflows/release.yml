name: Release Build

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["release/**"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, i9-cpu]
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Resolve version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          VERSION="${BRANCH#release/}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          uv pip install build --system
          python -m build --wheel
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: zakuroai
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push worker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            zakuroai/zakuro-worker:latest
            zakuroai/zakuro-worker:${{ steps.version.outputs.version }}
            ghcr.io/zakuro-ai/zakuro-worker:latest
            ghcr.io/zakuro-ai/zakuro-worker:${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for ref in \
            "zakuroai/zakuro-worker@${DIGEST}" \
            "ghcr.io/zakuro-ai/zakuro-worker@${DIGEST}"; do
            cosign sign --yes "$ref"
          done
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/zakuro-ai/zakuro-worker:${{ steps.version.outputs.version }}
          format: cyclonedx
          output: sbom-worker.cyclonedx.json
          exit-code: "0"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-worker.cyclonedx.json
