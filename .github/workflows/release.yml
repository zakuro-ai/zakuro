name: Release Build

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["release/**"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: cpu
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Resolve version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          VERSION="${BRANCH#release/}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          uv pip install build --system
          python -m build --wheel
      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          username: zakuroai
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - name: Build and push worker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            zakuroai/zakuro-worker:latest
            zakuroai/zakuro-worker:${{ steps.version.outputs.version }}
            ghcr.io/zakuro-ai/zakuro-worker:latest
            ghcr.io/zakuro-ai/zakuro-worker:${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for ref in \
            "zakuroai/zakuro-worker@${DIGEST}" \
            "ghcr.io/zakuro-ai/zakuro-worker@${DIGEST}"; do
            cosign sign --yes "$ref"
          done
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@cf5c088a69634cd13ccddc735d7926162c31f9a6  # master
        with:
          scan-type: image
          image-ref: ghcr.io/zakuro-ai/zakuro-worker:${{ steps.version.outputs.version }}
          format: cyclonedx
          output: sbom-worker.cyclonedx.json
          exit-code: "0"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom
          path: sbom-worker.cyclonedx.json
