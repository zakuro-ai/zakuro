name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.2.3)"
        required: true
      confirm_prod_deployed:
        description: "Confirm production deployment succeeded"
        type: boolean
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish-pypi:
    if: inputs.confirm_prod_deployed
    runs-on: [self-hosted, i9-cpu]
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v${{ inputs.version }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          uv pip install build --system
          python -m build --wheel
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crate:
    if: inputs.confirm_prod_deployed
    runs-on: [self-hosted, i9-cpu]
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v${{ inputs.version }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish crate
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: crates/zakuro-wire
