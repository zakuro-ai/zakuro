name: notice

on:
  push:
    branches: [master, main]
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/generate_notice.py"
      - "taskfiles/notice.yml"
      - "NOTICE"

permissions:
  contents: read

concurrency:
  group: notice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notice-check:
    name: NOTICE drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Regenerate NOTICE and fail on drift
        run: task notice:check
