name: sast

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"   # weekly CodeQL refresh
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  semgrep:
    name: Semgrep (python.security + custom rules)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:1.92.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep ci \
            --config p/python \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config .semgrep/zakuro.yml \
            --sarif --output semgrep.sarif \
            --error
        env:
          # No upload to Semgrep Cloud; we publish SARIF to GitHub instead.
          SEMGREP_RULES: ""
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # No license needed for OSS repos; auto-detects via GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_COMMENTS: "true"
