name: sast

on:
  push:
    branches: [main, master, dev]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"   # weekly CodeQL refresh
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  semgrep:
    name: Semgrep (python.security + custom rules)
    runs-on: ubuntu-latest
    # First introduction run flagged 3 findings — all expected cloudpickle /
    # pickle call sites that #117 is going to migrate to the safe wire format.
    # Mark this lane report-only until #117 ships, then ratchet to required.
    continue-on-error: true
    container:
      image: returntocorp/semgrep:1.92.0
    steps:
      - uses: actions/checkout@v6
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run Semgrep (report-only)
        # Drop `--error` so semgrep exits 0 on findings; SARIF still
        # uploads and findings still surface in the code-scanning view.
        # Add `--error` back once #117 retires the cloudpickle call sites.
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=.semgrep/zakuro.yml \
            --sarif --output=semgrep.sarif
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # gitleaks needs full history
      - name: Install gitleaks
        # The gitleaks-action GitHub Action requires a paid licence for org
        # repositories. The gitleaks binary itself stays MIT-licensed, so we
        # install and run it directly.
        run: |
          GL_VERSION=8.21.2
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks (full history)
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1
      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sops-encryption-check:
    name: SOPS encryption check
    # Closes the CI half of #118: refuse to merge if a file matching the
    # secret naming convention is committed in plaintext. Strict by design
    # (no continue-on-error) — a leaked secret is the one thing we do not
    # want to ratchet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find files that look like secrets but are not encrypted
        run: |
          set -eu

          # Files we expect to be SOPS-encrypted.
          mapfile -t candidates < <(
            git ls-files \
              'secrets/*' \
              '*.sops.yaml' \
              '*.sops.json' \
              '*.sops.env' \
              | grep -v -E '^(secrets/README\.md|\.sops\.yaml)$' || true
          )

          fail=0
          for f in "${candidates[@]}"; do
            [ -n "$f" ] || continue
            if ! grep -q '"sops":' "$f" 2>/dev/null \
               && ! grep -q '^sops:' "$f" 2>/dev/null; then
              echo "::error file=$f::file matches the secret naming convention but does not appear to be SOPS-encrypted"
              fail=1
            fi
          done
          exit "$fail"
