name: publish-crate

# Publishes the workspace crates to crates.io on every tag matching
# `zakuro-wire-vX.Y.Z`. Uses **crates.io Trusted Publishing** (OIDC) so
# no long-lived API token is stored in repository secrets.
#
# Manual setup before the first release (one-time):
#   1. Create the crate on crates.io: `cargo publish --dry-run` then
#      a real `cargo publish` from a maintainer's laptop.
#   2. On crates.io, open the crate's "Settings" → "Trusted Publishing"
#      and register:
#        repository owner    : zakuro-ai
#        repository name     : zakuro
#        workflow file       : publish-crate.yml
#        environment         : release
#        github branch       : master
#   3. Configure the `release` environment in this repo's settings:
#      required reviewers + the protection rule "tags matching
#      `zakuro-wire-v*`".
#
# After setup, releasing is:
#   git tag zakuro-wire-v0.1.1 && git push origin zakuro-wire-v0.1.1
# and this workflow handles the rest.

on:
  push:
    tags:
      - "zakuro-wire-v*"
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate name to publish (must match a workspace member)"
        required: true
        default: "zakuro-wire"
      dry_run:
        description: "Set to true to publish-dry-run without uploading"
        required: false
        default: "false"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish (Trusted Publishing)
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/zakuro-wire
    permissions:
      id-token: write   # OIDC for crates.io Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Resolve crate from tag
        id: crate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.crate }}" >> "$GITHUB_OUTPUT"
          else
            # tag is `zakuro-wire-vX.Y.Z`; pull the package name from the prefix
            tag="${GITHUB_REF##refs/tags/}"
            name="${tag%-v*}"
            echo "name=$name" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the crate version matches the tag
        if: github.event_name == 'push'
        run: |
          set -eu
          tag="${GITHUB_REF##refs/tags/}"
          want_version="${tag##*-v}"
          have_version="$(cargo pkgid -p ${{ steps.crate.outputs.name }} | sed -E 's/.*#//; s/.*@//')"
          if [ "$want_version" != "$have_version" ]; then
            echo "::error::tag wants $want_version but crate is at $have_version" >&2
            exit 1
          fi
          echo "Publishing ${{ steps.crate.outputs.name }} v$have_version"

      - name: cargo publish (Trusted Publishing)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: rust-lang/crates-io-auth-action@v1
        # The action mints an OIDC token, exchanges it for a crates.io
        # ephemeral key, and runs `cargo publish` under that key. No
        # `CARGO_REGISTRY_TOKEN` secret needed.
        with:
          crate: ${{ steps.crate.outputs.name }}

      - name: cargo publish --dry-run (workflow_dispatch only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: cargo publish -p ${{ steps.crate.outputs.name }} --dry-run --locked
