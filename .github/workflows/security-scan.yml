name: security-scan

on:
  push:
    branches: [main, master, dev]
  pull_request:
  schedule:
    # Daily run so newly disclosed advisories surface even on quiet weeks.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to the GitHub code-scanning view

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (PyPI advisories)
    runs-on: ubuntu-latest
    # report-only on introduction; SARIF/console output is published but the
    # lane does not block PRs until the existing findings are cleaned up by
    # Dependabot rollups + targeted bump PRs. Switch to `false` once the
    # cleanup sprint lands to make this a required check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Export resolved requirements
        # We feed the locked resolution into pip-audit so the audit reflects
        # exactly what is installed, not just the loosely-pinned project
        # specifiers in pyproject.toml.
        run: |
          uv export --format requirements-txt --no-hashes \
            --all-extras --frozen > requirements.audit.txt
      - name: Install pip-audit
        run: pipx install pip-audit
      - name: Run pip-audit (report-only)
        # `|| true` keeps the JOB green so the commit list / merge
        # surface isn't a permanent red X. Findings still print to the
        # log; drop `|| true` (and add --strict back) once the dep
        # cleanup sprint zeroes the catalogue.
        run: |
          pip-audit \
            --requirement requirements.audit.txt \
            --vulnerability-service osv || true
      - name: Upload audit input on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-input
          path: requirements.audit.txt
          retention-days: 14

  osv-scanner:
    name: osv-scanner (lockfile)
    # Report-only. OSV's database updates daily, so the lane can flip
    # red on a master push without any code change. Drop the strict
    # reusable workflow and run the binary directly so we can mark the
    # job continue-on-error — `continue-on-error` is not allowed on
    # `uses: ...` reusable-workflow callers, which is what broke the
    # earlier attempt (the entire workflow refused to parse).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner
        run: |
          OSV_VERSION=2.0.0
          curl -sSL \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Run osv-scanner against uv.lock
        run: |
          osv-scanner \
            --lockfile=uv.lock \
            --recursive \
            --format=sarif \
            --output=osv-scanner.sarif \
            || true
      - name: Upload SARIF
        if: always() && hashFiles('osv-scanner.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner

  trivy-fs:
    name: trivy fs (repo)
    runs-on: ubuntu-latest
    continue-on-error: true   # see pip-audit; ratchet once findings cleaned up
    steps:
      - uses: actions/checkout@v6
      - name: Run trivy fs (report-only)
        # exit-code: "0" -> SARIF uploads, job stays green even on
        # HIGH/CRITICAL findings. Flip to "1" when the catalogue is zero.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: trivy image
    runs-on: ubuntu-latest
    # Currently fails at the docker build step (`lstat /dist`); the Dockerfiles
    # expect a pre-built wheel dist/ that this CI lane does not yet produce.
    # Wiring the wheel build into the pipeline is its own ticket — until that
    # lands, scope this lane as report-only so PR merges are not gated on a
    # missing build step.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile
            tag: zakuro-worker:scan
            slug: worker
          # NOTE: the broker (zc) is a separate repo
          # (https://github.com/zakuro-ai/zc) and runs its own trivy
          # image scan in its own CI. We do NOT scan
          # `zakuroai/zc` from zakuro — that would duplicate scope and
          # confuse provenance. If you need a cross-repo combined scan,
          # add it as a downstream tracking workflow elsewhere.
    steps:
      - uses: actions/checkout@v6
      - name: Build image (no push, allowed to fail)
        # The wheel-build wiring (#149) for this scan lane lives in the
        # Docker workflow, not here. Until trivy-image is wired against
        # the wheel artefact, `continue-on-error: true` keeps the step
        # green so the JOB stays green too.
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.tag }}
          push: false
          load: true
      - name: Run trivy image (report-only)
        # exit-code: "0" -> SARIF uploads, job stays green on findings.
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-image-${{ matrix.slug }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - name: Upload SARIF
        if: always() && hashFiles(format('trivy-image-{0}.sarif', matrix.slug)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-${{ matrix.slug }}.sarif
          category: trivy-image-${{ matrix.slug }}
