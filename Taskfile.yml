version: '3'

vars:
  MODULE: zakuro
  IMAGE: zakuroai/zakuro-worker

includes:
  build:
    taskfile: taskfiles/build.yml
    optional: true
  docker:
    taskfile: taskfiles/docker.yml
    optional: true
  test:
    taskfile: taskfiles/test.yml
    optional: true
  deploy:
    taskfile: taskfiles/deploy.yml
    optional: true
  ci:
    taskfile: taskfiles/ci.yml
    optional: true
  notice:
    taskfile: taskfiles/notice.yml
    optional: true

dotenv: ['.env']

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install prerequisites and verify environment
    cmds:
      - echo "Checking prerequisites..."
      - cmd: command -v python >/dev/null 2>&1 && echo "  [OK] python $(python --version 2>&1 | cut -d' ' -f2)" || echo "  [MISSING] python"
      - cmd: 'command -v uv >/dev/null 2>&1 && echo "  [OK] uv" || echo "  [MISSING] uv - install with: curl -LsSf https://astral.sh/uv/install.sh | sh"'
      - cmd: command -v docker >/dev/null 2>&1 && echo "  [OK] docker" || echo "  [MISSING] docker"
      - cmd: command -v task >/dev/null 2>&1 && echo "  [OK] task" || echo "  [MISSING] task"
      - echo ""
      - echo "Installing Python dependencies..."
      - uv sync --all-extras

  dev:
    desc: Install package in development mode
    cmds:
      - uv pip install --system -e ".[all]"

  clean:
    desc: Clean all build artifacts
    cmds:
      - rm -rf dist/ build/ *.egg-info .pytest_cache .mypy_cache .ruff_cache
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete 2>/dev/null || true

  worker:dev:
    desc: Start development worker with hot reload
    cmds:
      - uvicorn zakuro.worker.server:app --host 0.0.0.0 --port 3960 --reload

  worker:prod:
    desc: Start production worker
    cmds:
      - uvicorn zakuro.worker.server:app --host 0.0.0.0 --port 3960 --workers 4

  reinstall:
    desc: Rebuild wheel, uninstall current version, and reinstall
    cmds:
      - rm -rf dist/
      - python -m build
      - pip uninstall -y zakuro-ai
      - pip install --break-system-packages dist/*.whl

  # build:wheel comes from taskfiles/build.yml via the `build` include;
  # the previous inline duplicate conflicted with the included version
  # and produced `task: Found multiple tasks (build:wheel) included by
  # "build"`. Kept only build:image here because it isn't in build.yml.
  build:image:
    desc: Build zakuro image (FROM compute)
    cmds:
      # The image builds its own wheel from source in a builder stage
      # (docker/Dockerfile.compute), so no `task build:wheel` prereq is
      # needed — `docker build` is self-contained from a clean checkout. (#232)
      - docker build -f docker/Dockerfile.compute -t zakuroai/zakuro:${HW:-cpu} .

  up:compute:
    desc: Start zakuro on compute stack
    cmds:
      - docker compose -f docker/docker-compose.compute.yml up -d {{.CLI_ARGS}}

  down:compute:
    desc: Stop zakuro compute stack
    cmds:
      - docker compose -f docker/docker-compose.compute.yml down {{.CLI_ARGS}}

  demo:broker:
    desc: Run broker demo script (requires broker running)
    cmds:
      - ./scripts/demo_broker.sh

  demo:notebook:
    desc: Open broker demo notebook in JupyterLab
    cmds:
      - jupyter lab notebooks/demo_broker.ipynb

  ci-local:
    desc: Run all CI checks locally (mirrors GitHub Actions)
    cmds:
      - task: ci:lint
      - task: ci:format-check
      - task: ci:typecheck
      - task: test:unit
      - task: test:coverage-check
      - cargo test --workspace
