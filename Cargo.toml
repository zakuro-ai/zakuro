[workspace]
members = ["crates/zakuro-wire"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/zakuro-ai/zakuro"
homepage = "https://zakuro-ai.com"
authors = ["ZakuroAI <git@zakuro-ai.com>"]
rust-version = "1.75"

[workspace.dependencies]
postcard = { version = "1.0", default-features = false, features = ["alloc", "use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
