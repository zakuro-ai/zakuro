[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zakuro-ai"
dynamic = ["version"]
description = "Zakuro - Distributed computing made simple"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "ZakuroAI", email = "dev@zakuro.ai" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cloudpickle>=3.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "minio>=7.0.0",
]

[project.optional-dependencies]
worker = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "psutil>=5.9.0",
    "aioquic>=1.0.0",
    # PyJWT for Ed25519 JWT verification (RFC 0002, #116). The cryptography
    # extra pulls in pyca/cryptography needed for asymmetric algorithms.
    "PyJWT[crypto]>=2.8.0",
    # bsdiff4 for state-dict delta encoding (RFC 0001 amendment, #174).
    # The worker uses bsdiff4.patch(cached, delta) -> full_payload when an
    # incoming envelope's delta_against is set. Pure-Python fallback ships
    # with the package; the C extension speeds it up when available.
    "bsdiff4>=1.2.4",
]
ray = ["ray>=2.0.0"]
dask = ["dask>=2023.0.0", "distributed>=2023.0.0"]
spark = ["pyspark>=3.0.0"]
all-processors = ["zakuro-ai[ray,dask,spark]"]
observability = [
    # Sentry SDK is opt-in: zakuro.observability.init_sentry is a no-op when
    # the package is not installed or SENTRY_DSN is unset. Install via
    # `pip install 'zakuro-ai[observability]'` or `uv sync --extra observability`.
    "sentry-sdk>=2.0.0",
    # structlog produces JSON-rendered logs that share the request-context
    # ContextVar with the Sentry scrubber. RFC 0003 Track A (#125).
    "structlog>=24.1.0",
    # Prometheus client for /metrics. RFC 0003 Track B (#124). No-op when
    # the dep is missing.
    "prometheus_client>=0.20.0",
    # OpenTelemetry tracing (RFC 0003 Track C, #123). The SDK + OTLP HTTP
    # exporter ship traces to any OTLP-compatible collector. FastAPI +
    # httpx auto-instrumentation cover the HTTP transport surface for free;
    # QUIC requires hand-rolled spans (zakuro.observability.tracing).
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "pre-commit>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]
all = ["zakuro-ai[worker,dev,all-processors,observability]"]

[project.urls]
Homepage = "https://zakuro.ai"
Documentation = "https://docs.zakuro.ai"
Repository = "https://github.com/zakuro-ai/zakuro"
Issues = "https://github.com/zakuro-ai/zakuro/issues"

[project.scripts]
zakuro-worker = "zakuro.worker.cli:main"

[tool.hatch.version]
path = "zakuro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["zakuro"]
# Ensure the PEP 561 marker ships in the wheel so mypy / pyright pick up
# inline annotations on the public surface. See docs/STABILITY.md.
# NOTICE is force-included at the package root so it is discoverable via
# `importlib.resources.files("zakuro") / "NOTICE"` from any consumer.
include = ["zakuro/py.typed"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "zakuro/NOTICE"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=zakuro --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
# Surface unused `# type: ignore` so they don't accumulate as dead annotations.
warn_unused_ignores = true
# Strict mode is the goal, but the codebase has not been written to it.
# We ratchet via per-module overrides below as each module gets annotated.
# Touching these defaults without a per-module plan re-introduces the
# 90-error backlog #167 spent a sprint clearing.
warn_return_any = false
disallow_untyped_defs = false
# zakuro.fs and zakuro.hub are legacy modules — broken imports (zakuro.var,
# zakuro.cfg) that are no longer reachable from any package, test, or entry
# point. Deletion is tracked separately; until then exclude from typecheck.
exclude = [
    "^zakuro/fs/",
    "^zakuro/hub/",
]

[[tool.mypy.overrides]]
# Third-party libraries that ship without py.typed markers. Updates to
# this list should reference the pinned version in pyproject / uv.lock.
module = [
    "bsdiff4",
    "bsdiff4.*",
    "cloudpickle",
    "cloudpickle.*",
    "gnutools",
    "gnutools.*",
    "miniofs",
    "miniofs.*",
    "psutil",
    "psutil.*",
    "torch",
    "torch.*",
    "tqdm",
    "tqdm.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]
