# Two completely independent Zakuro nodes — Tailscale-only communication
#
# Each node is isolated in its own Docker network.
# Brokers discover each other exclusively via Tailscale IPs.
# No cross-node Docker connectivity at all.
#
# Prerequisites:
#   source ~/.zakuro/env   # sets ZK0NODE01_ZAKURO_KEY, ZK0NODE02_ZAKURO_KEY,
#                          #       ZK0NODE01_TAILSCALE_IP, ZK0NODE02_TAILSCALE_IP,
#                          #       ZAKURO_PEER_KEY, ZK0NODE01_TS_AUTHKEY (Tailscale key for node1)
#
# Usage:
#   docker compose -f docker/docker-compose.two-nodes.yml up -d --build
#   docker compose -f docker/docker-compose.two-nodes.yml logs -f node1-broker node2-broker
#
# Broker HTTP ports (host):
#   node1 → localhost:9001
#   node2 → localhost:9002

services:

  # ═══════════════════════════════════════════════════════════
  # NODE 1  (isolated: node1-net only)
  # ═══════════════════════════════════════════════════════════

  node1-broker:
    build:
      context: .
      dockerfile: Dockerfile.broker-runtime
    environment:
      ZAKURO_NODE_NAME: zk0-node01
      # NOTE: user1 (1000000001) does not have broker API access on the dashboard
      # (POST /api/broker/transaction returns 403). Node1 therefore runs in
      # standalone mode — billing is tracked locally, but jobs do NOT appear on
      # the dashboard. To enable dashboard reporting, grant user1 broker API access.
      ZAKURO_MASTER_KEY: node1-master-key
      # Peer = node2 Tailscale IP (Tailscale tunnel, not Docker network)
      ZAKURO_PEERS: ${ZK0NODE02_TAILSCALE_IP:-}:9000
      ZAKURO_PEER_KEY: ${ZAKURO_PEER_KEY:-zakuro-p2p-secret}
      ZAKURO_P2P: "true"
      ZAKURO_SCAN_RANGE: "3960-3962"
    ports:
      - "9001:9000"
    networks: [node1-net]
    volumes:
      - ../../zak-zc/target/release/zc:/usr/local/bin/zc:ro
      - node1-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5

  node1-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ZAKURO_WORKER_NAME: zk0-node01-worker-0
      ZAKURO_WORKER_TYPE: standard
      ZAKURO_CPU_PRICE: "0.001"
      ZAKURO_MEMORY_PRICE: "0.0001"
      ZAKURO_PORT: "3960"
      PYTHONUNBUFFERED: "1"
    network_mode: "service:node1-broker"
    depends_on:
      node1-broker:
        condition: service_healthy

  node1-worker-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ZAKURO_WORKER_NAME: zk0-node01-worker-1
      ZAKURO_WORKER_TYPE: standard
      ZAKURO_CPU_PRICE: "0.001"
      ZAKURO_MEMORY_PRICE: "0.0001"
      ZAKURO_PORT: "3961"
      PYTHONUNBUFFERED: "1"
    network_mode: "service:node1-broker"
    depends_on:
      node1-broker:
        condition: service_healthy

  node1-tailscale:
    image: tailscale/tailscale:latest
    cap_add: [NET_ADMIN, NET_RAW, SYS_MODULE]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Use admin key to fetch Tailscale auth key (requires admin-level API access)
      ZAKURO_API_KEY: ${ZAKURO_ADMIN_API_KEY:-${ZK0NODE02_ZAKURO_KEY}}
      ZAKURO_API_URL: https://my.zakuro-ai.com
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: "--hostname=zk0-node01 --netfilter-mode=off"
      # Allow direct auth key injection when available (skips API fetch)
      TS_AUTHKEY: ${ZK0NODE01_TS_AUTHKEY:-}
    entrypoint: ["/bin/sh", "/tailscale-entrypoint.sh"]
    network_mode: "service:node1-broker"
    depends_on:
      node1-broker:
        condition: service_healthy
    volumes:
      - node1-ts:/var/lib/tailscale
      - ./tailscale-entrypoint.sh:/tailscale-entrypoint.sh:ro

  # ═══════════════════════════════════════════════════════════
  # NODE 2  (isolated: node2-net only)
  # ═══════════════════════════════════════════════════════════

  node2-broker:
    build:
      context: .
      dockerfile: Dockerfile.broker-runtime
    environment:
      ZAKURO_NODE_NAME: zk0-node02
      ZAKURO_API_URL: https://my.zakuro-ai.com
      ZAKURO_API_KEY: ${ZK0NODE02_ZAKURO_KEY}
      # Peer = node1 Tailscale IP (Tailscale tunnel, not Docker network)
      ZAKURO_PEERS: ${ZK0NODE01_TAILSCALE_IP:-}:9000
      ZAKURO_PEER_KEY: ${ZAKURO_PEER_KEY:-zakuro-p2p-secret}
      ZAKURO_P2P: "true"
      ZAKURO_SCAN_RANGE: "3960-3962"
    ports:
      - "9002:9000"
    networks: [node2-net]
    volumes:
      - ../../zak-zc/target/release/zc:/usr/local/bin/zc:ro
      - node2-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5

  node2-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ZAKURO_WORKER_NAME: zk0-node02-worker-0
      ZAKURO_WORKER_TYPE: premium
      ZAKURO_CPU_PRICE: "0.003"
      ZAKURO_MEMORY_PRICE: "0.0003"
      ZAKURO_MIN_CHARGE: "1.0"
      ZAKURO_PORT: "3960"
      PYTHONUNBUFFERED: "1"
    network_mode: "service:node2-broker"
    depends_on:
      node2-broker:
        condition: service_healthy

  node2-worker-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ZAKURO_WORKER_NAME: zk0-node02-worker-1
      ZAKURO_WORKER_TYPE: premium
      ZAKURO_CPU_PRICE: "0.003"
      ZAKURO_MEMORY_PRICE: "0.0003"
      ZAKURO_MIN_CHARGE: "1.0"
      ZAKURO_PORT: "3961"
      PYTHONUNBUFFERED: "1"
    network_mode: "service:node2-broker"
    depends_on:
      node2-broker:
        condition: service_healthy

  node2-tailscale:
    image: tailscale/tailscale:latest
    cap_add: [NET_ADMIN, NET_RAW, SYS_MODULE]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      ZAKURO_API_KEY: ${ZK0NODE02_ZAKURO_KEY}
      ZAKURO_API_URL: https://my.zakuro-ai.com
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: "--hostname=zk0-node02 --netfilter-mode=off"
    entrypoint: ["/bin/sh", "/tailscale-entrypoint.sh"]
    network_mode: "service:node2-broker"
    depends_on:
      node2-broker:
        condition: service_healthy
    volumes:
      - node2-ts:/var/lib/tailscale
      - ./tailscale-entrypoint.sh:/tailscale-entrypoint.sh:ro

networks:
  node1-net:
    driver: bridge
  node2-net:
    driver: bridge

volumes:
  node1-data:
  node1-ts:
  node2-data:
  node2-ts:
